name: Build & Publish Android APK Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Valid Signed APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install SDK 36 / Build-Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Restore Debug Keystore & Prepare Release Signing Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass aniimorelease123 \
              -alias upload \
              -keypass aniimorelease123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Aniimo DPS Community,O=AniimoDPS,C=US"
          fi

          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Signed APK & AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: aniimorelease123
          KEY_PASSWORD: aniimorelease123
        run: |
          gradle assembleDebug assembleRelease bundleRelease -x lint -x lintVitalRelease --no-daemon

      - name: Align & Re-Sign APK with V1 + V2 + V3 Signatures for Universal Android Compatibility
        run: |
          mkdir -p release-dist
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)

          $ZIPALIGN -p -f -v 4 app/build/outputs/apk/release/app-release.apk release-dist/Aniimo-DPS-v1.0.apk
          $APKSIGNER sign \
            --ks my-upload-key.jks \
            --ks-key-alias upload \
            --ks-pass pass:aniimorelease123 \
            --key-pass pass:aniimorelease123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            release-dist/Aniimo-DPS-v1.0.apk

          $APKSIGNER verify -v release-dist/Aniimo-DPS-v1.0.apk
          cp app/build/outputs/bundle/release/app-release.aab release-dist/Aniimo-DPS-v1.0-PlayStore.aab

      - name: Publish Installable APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Aniimo DPS v1.0 — Official Android APK Installer"
          body: |
            ## 📲 Direct Android Phone Installation
            Tap **`Aniimo-DPS-v1.0.apk`** under **Assets** below to download and install the app directly on your Android phone or tablet.

            > **Important**: Download **`Aniimo-DPS-v1.0.apk`** (approx. 45 MB) from the **Assets** section below. Do **not** try to install `.zip` files from the Actions tab or `.aab` files on your phone, as Android only installs `.apk` files directly.
          files: |
            release-dist/Aniimo-DPS-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
