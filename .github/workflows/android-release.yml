name: Publish Pre-Built Android APK Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk-release:
    name: Publish Verified APK to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Pre-Built APK Integrity
        run: |
          ls -lh Aniimo-DPS-v1.0.apk
          unzip -t Aniimo-DPS-v1.0.apk | head -n 20

      - name: Publish Installable APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Aniimo DPS v1.0 — Official Android APK Installer"
          body: |
            ## 📲 Direct Android Phone Installation
            Tap **`Aniimo-DPS-v1.0.apk`** under **Assets** below to download and install **Aniimo DPS** on your Android phone or tablet.
          files: |
            Aniimo-DPS-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
